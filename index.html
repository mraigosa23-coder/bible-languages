<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5-Language Bible Study</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter (UI), Frank Ruhl Libre (Hebrew + Nikud), Gentium Plus (Polytonic Greek), Noto Sans SC (Chinese) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Gentium+Plus:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#f8f7f4',
            scholar: {
              DEFAULT: '#3b4b80',
              dark: '#2e3b66',
              light: '#eef1f8',
              border: '#d6dced',
            },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            hebrew: ['"Frank Ruhl Libre"', '"SBL Hebrew"', '"Times New Roman"', 'serif'],
            greek: ['"Gentium Plus"', 'Georgia', '"Times New Roman"', 'serif'],
            chinese: ['"Noto Sans SC"', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    /* Hide scrollbar cleanly on horizontal tab navigation */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Gentle pulse ring when Web Speech API is actively reading */
    @keyframes speakPulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(59, 75, 128, 0.35);
      }
      50% {
        box-shadow: 0 0 0 6px rgba(59, 75, 128, 0);
      }
    }
    .speaking-pulse {
      animation: speakPulse 1.4s infinite;
    }
  </style>
</head>
<body class="bg-[#f8f7f4] text-slate-800 font-sans antialiased min-h-screen selection:bg-scholar-light selection:text-scholar-dark">

  <!-- Main App Shell -->
  <div class="max-w-4xl mx-auto px-4 sm:px-6 py-5 sm:py-9">

    <!-- Top Header & Verse Selector Bar -->
    <header class="bg-white border border-stone-200/90 rounded-2xl p-4 sm:p-5 shadow-sm mb-5">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <!-- Brand Title -->
        <div>
          <div class="flex items-center gap-2">
            <span class="inline-flex items-center justify-center w-8 h-8 rounded-xl bg-[#3b4b80] text-white shadow-sm shrink-0">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path>
              </svg>
            </span>
            <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900">
              5-Language Bible Study
            </h1>
          </div>
          <p class="text-xs sm:text-sm text-slate-500 mt-1">
            Hebrew &middot; Greek LXX &middot; Spanish &middot; Chinese &middot; Indonesian
          </p>
        </div>

        <!-- Daily Progress Badge for Current Verse -->
        <div class="flex items-center gap-2 bg-[#f8f7f4] border border-stone-200/80 rounded-xl px-3 py-2 self-start sm:self-auto">
          <span class="text-xs font-medium text-slate-500">Verse Progress</span>
          <span id="progress-badge" class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-scholar-light text-[#3b4b80]">
            0 / 5 done
          </span>
        </div>
      </div>

      <!-- Verse Switcher Controls -->
      <div class="mt-4 pt-4 border-t border-stone-100 flex items-center gap-2 sm:gap-3">
        <button
          type="button"
          id="prev-verse-btn"
          class="inline-flex items-center justify-center px-3 sm:px-3.5 py-2.5 rounded-xl border border-stone-200 bg-white text-slate-700 hover:border-[#3b4b80] hover:text-[#3b4b80] disabled:opacity-40 disabled:pointer-events-none text-sm font-semibold transition cursor-pointer shrink-0"
          aria-label="Previous verse"
          title="Previous verse"
        >
          &larr;<span class="hidden sm:inline ml-1.5">Prev</span>
        </button>

        <div class="relative flex-1 min-w-0">
          <label for="verse-select" class="sr-only">Select Verse</label>
          <select
            id="verse-select"
            class="w-full appearance-none bg-[#f8f7f4] hover:bg-stone-100/80 border border-stone-200 focus:border-[#3b4b80] focus:ring-2 focus:ring-[#3b4b80]/20 rounded-xl pl-4 pr-10 py-2.5 text-sm sm:text-base font-semibold text-slate-900 transition cursor-pointer focus:outline-none truncate"
          ></select>
          <svg class="w-4 h-4 text-slate-500 pointer-events-none absolute right-3.5 top-1/2 -translate-y-1/2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>

        <button
          type="button"
          id="next-verse-btn"
          class="inline-flex items-center justify-center px-3 sm:px-3.5 py-2.5 rounded-xl border border-stone-200 bg-white text-slate-700 hover:border-[#3b4b80] hover:text-[#3b4b80] disabled:opacity-40 disabled:pointer-events-none text-sm font-semibold transition cursor-pointer shrink-0"
          aria-label="Next verse"
          title="Next verse"
        >
          <span class="hidden sm:inline mr-1.5">Next</span>&rarr;
        </button>
      </div>
    </header>

    <!-- 5 Language Tabs -->
    <nav aria-label="Language Tabs" class="mb-5">
      <div id="tab-bar" role="tablist" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
        <!-- Tabs rendered dynamically -->
      </div>
    </nav>

    <!-- Active Study Card Content -->
    <main id="study-panel" class="space-y-5">
      <!-- Rendered dynamically -->
    </main>

    <!-- Footer -->
    <footer class="mt-10 pt-5 border-t border-stone-200/80 text-center text-xs text-slate-400 space-y-1">
      <p>Progress is saved automatically in your browser. Built-in speech uses the Web Speech API, with Google Translate links as a fallback.</p>
    </footer>
  </div>

  <!-- Toast Container (replaces alert/confirm) -->
  <div
    id="toast-container"
    aria-live="polite"
    class="fixed bottom-5 right-5 z-50 pointer-events-none flex flex-col gap-2 max-w-xs w-full px-4 sm:px-0"
  ></div>

  <script>
    /* =========================================================================
       1. LANGUAGE METADATA & APPLICATION CONFIGURATION
       ========================================================================= */
    const LANG_CONFIG = [
      {
        key: 'hebrew',
        tabLabel: 'Hebrew',
        fullTitle: 'Biblical Hebrew',
        subtitle: 'Masoretic Text (RTL)',
        timeLabel: '2.5m',
        durationSec: 150,
        dir: 'rtl',
        hasAudio: false,
      },
      {
        key: 'greek',
        tabLabel: 'Greek LXX',
        fullTitle: 'Biblical Greek — LXX',
        subtitle: 'Septuagint (Polytonic)',
        timeLabel: '2.5m',
        durationSec: 150,
        dir: 'ltr',
        hasAudio: false,
      },
      {
        key: 'spanish',
        tabLabel: 'Spanish',
        fullTitle: 'Spanish',
        subtitle: 'Modern Translation · Audio Enabled (es-MX)',
        timeLabel: '1–2m',
        durationSec: 120,
        dir: 'ltr',
        hasAudio: true,
        speechLang: 'es-MX',
        speechPrefix: 'es',
        gtLang: 'es',
      },
      {
        key: 'chinese',
        tabLabel: 'Chinese',
        fullTitle: 'Chinese (Mandarin)',
        subtitle: 'Character-Aligned Pinyin · Audio Enabled (zh-CN)',
        timeLabel: '2–3m',
        durationSec: 180,
        dir: 'ltr',
        hasAudio: true,
        speechLang: 'zh-CN',
        speechPrefix: 'zh',
        gtLang: 'zh-CN',
      },
      {
        key: 'indonesian',
        tabLabel: 'Indonesian',
        fullTitle: 'Indonesian',
        subtitle: 'Root-Word Breakdown · Audio Enabled (id-ID)',
        timeLabel: '2–3m',
        durationSec: 180,
        dir: 'ltr',
        hasAudio: true,
        speechLang: 'id-ID',
        speechPrefix: 'id',
        gtLang: 'id',
      },
    ];

    /* =========================================================================
       2. RUNTIME STATE
       ========================================================================= */
    const state = {
      verseIndex: 0,
      activeLangKey: 'hebrew',
      speechRate: 1.0, // 1.0 (Normal) or 0.7 (Slow)
      speakingKey: null,
      voices: [],
      voicesLoaded: false,
      timers: LANG_CONFIG.reduce((acc, cfg) => {
        acc[cfg.key] = {
          remaining: cfg.durationSec,
          running: false,
          intervalId: null,
        };
        return acc;
      }, {}),
    };

    /* =========================================================================
       3. LOCAL STORAGE HELPERS (PER-VERSE + PER-LANGUAGE COMPLETION)
       ========================================================================= */
    function getDoneStorageKey(verseId, langKey) {
      // Converts "gen-1-2" + "hebrew" -> "done_gen_1_2_hebrew"
      const normalized = String(verseId).replace(/[^a-zA-Z0-9]+/g, '_');
      return `done_${normalized}_${langKey}`;
    }

    function isLangDone(verseId, langKey) {
      try {
        return localStorage.getItem(getDoneStorageKey(verseId, langKey)) === '1';
      } catch (err) {
        return false;
      }
    }

    function setLangDone(verseId, langKey, done) {
      try {
        const key = getDoneStorageKey(verseId, langKey);
        if (done) {
          localStorage.setItem(key, '1');
        } else {
          localStorage.removeItem(key);
        }
      } catch (err) {
        console.warn('localStorage unavailable:', err);
      }
    }

    function countVerseDone(verseId) {
      return LANG_CONFIG.reduce((count, cfg) => count + (isLangDone(verseId, cfg.key) ? 1 : 0), 0);
    }

    function saveLastSelection() {
      try {
        const verse = getActiveVerse();
        if (verse) {
          localStorage.setItem('study_last_verse_id', verse.id);
        }
        localStorage.setItem('study_last_lang_key', state.activeLangKey);
      } catch (err) {
        // Ignore storage errors in private browsing modes
      }
    }

    function restoreLastSelection() {
      try {
        const savedVerseId = localStorage.getItem('study_last_verse_id');
        if (savedVerseId) {
          const idx = VERSES.findIndex((v) => v.id === savedVerseId);
          if (idx !== -1) state.verseIndex = idx;
        }
        const savedLang = localStorage.getItem('study_last_lang_key');
        if (savedLang && LANG_CONFIG.some((c) => c.key === savedLang)) {
          state.activeLangKey = savedLang;
        }
      } catch (err) {
        // Ignore storage errors
      }
    }

    /* =========================================================================
       4. WEB SPEECH API (TTS) ENGINE
       ========================================================================= */
    const synthSupported = typeof window !== 'undefined' && 'speechSynthesis' in window;

    function loadVoices() {
      if (!synthSupported) return;
      try {
        const list = window.speechSynthesis.getVoices();
        if (list && list.length > 0) {
          state.voices = list;
          state.voicesLoaded = true;
          updateVoiceNotice();
        }
      } catch (err) {
        console.warn('Error loading voices:', err);
      }
    }

    if (synthSupported) {
      loadVoices();
      if (typeof window.speechSynthesis.onvoiceschanged !== 'undefined') {
        window.speechSynthesis.onvoiceschanged = loadVoices;
      }
    }

    function findBestVoice(speechLang, speechPrefix) {
      if (!state.voices.length) return null;
      const exact = state.voices.find(
        (v) => v.lang && v.lang.toLowerCase() === speechLang.toLowerCase()
      );
      if (exact) return exact;
      return (
        state.voices.find(
          (v) => v.lang && v.lang.toLowerCase().startsWith(speechPrefix.toLowerCase())
        ) || null
      );
    }

    function stopSpeaking() {
      if (synthSupported) {
        try {
          window.speechSynthesis.cancel();
        } catch (err) {
          console.warn(err);
        }
      }
      state.speakingKey = null;
      updateSpeakingButtonsUI();
    }

    function speakText(text, langCfg, buttonKey) {
      if (!synthSupported) {
        showToast('Built-in speech is unavailable in this browser. Use the Google Translate link instead.', 'warn');
        return;
      }

      // Clicking the active button stops playback
      if (state.speakingKey === buttonKey) {
        stopSpeaking();
        return;
      }

      try {
        window.speechSynthesis.cancel();
      } catch (err) {
        console.warn(err);
      }

      // Strip spaces for Chinese compounds so Mandarin TTS reads smoothly
      const cleanText =
        langCfg.speechPrefix === 'zh' ? String(text).replace(/\s+/g, '') : String(text).trim();

      try {
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = langCfg.speechLang;
        utterance.rate = state.speechRate;

        const voice = findBestVoice(langCfg.speechLang, langCfg.speechPrefix);
        if (voice) utterance.voice = voice;

        state.speakingKey = buttonKey;
        updateSpeakingButtonsUI();

        utterance.onend = () => {
          if (state.speakingKey === buttonKey) {
            state.speakingKey = null;
            updateSpeakingButtonsUI();
          }
        };

        utterance.onerror = (event) => {
          if (event.error !== 'interrupted' && event.error !== 'canceled') {
            showToast('Audio playback had an issue—try the Google Translate link.', 'warn');
          }
          if (state.speakingKey === buttonKey) {
            state.speakingKey = null;
            updateSpeakingButtonsUI();
          }
        };

        window.speechSynthesis.speak(utterance);
      } catch (err) {
        console.error('TTS error:', err);
        state.speakingKey = null;
        updateSpeakingButtonsUI();
        showToast('Unable to start audio playback on this device.', 'warn');
      }
    }

    function updateSpeakingButtonsUI() {
      document.querySelectorAll('[data-speak-key]').forEach((btn) => {
        const key = btn.getAttribute('data-speak-key');
        const isVerse = btn.getAttribute('data-speak-type') === 'verse';
        const active = state.speakingKey === key;

        if (isVerse) {
          if (active) {
            btn.className =
              'inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold bg-[#2e3b66] text-white shadow-sm speaking-pulse transition cursor-pointer focus:outline-none focus:ring-2 focus:ring-[#3b4b80]/40';
            btn.innerHTML = `${getStopIconSVG()}<span>Stop Audio</span>`;
          } else {
            btn.className =
              'inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold bg-[#3b4b80] hover:bg-[#2e3b66] active:scale-[0.98] text-white shadow-sm transition cursor-pointer focus:outline-none focus:ring-2 focus:ring-[#3b4b80]/40';
            btn.innerHTML = `${getSpeakerIconSVG()}<span>Listen (Full Verse)</span>`;
          }
        } else {
          if (active) {
            btn.className =
              'inline-flex items-center justify-center w-10 h-10 rounded-xl bg-[#3b4b80] text-white shadow-sm speaking-pulse transition cursor-pointer focus:outline-none focus:ring-2 focus:ring-[#3b4b80]/40';
            btn.innerHTML = getStopIconSVG();
            btn.setAttribute('aria-label', 'Stop audio');
          } else {
            btn.className =
              'inline-flex items-center justify-center w-10 h-10 rounded-xl bg-[#f8f7f4] hover:bg-scholar-light hover:text-[#3b4b80] text-slate-600 border border-stone-200/80 active:scale-95 transition cursor-pointer focus:outline-none focus:ring-2 focus:ring-[#3b4b80]/40';
            btn.innerHTML = getSpeakerIconSVG();
            btn.setAttribute('aria-label', 'Play word audio');
          }
        }
      });
    }

    function updateVoiceNotice() {
      const notice = document.getElementById('voice-notice');
      if (!notice) return;
      const cfg = getActiveLangConfig();
      if (!cfg.hasAudio) {
        notice.classList.add('hidden');
        return;
      }

      if (!synthSupported) {
        notice.innerHTML =
          '<strong>Audio Note:</strong> Your browser does not support built-in speech. Use the <strong>Google Translate &nearr;</strong> link above to listen.';
        notice.classList.remove('hidden');
        return;
      }

      if (state.voicesLoaded) {
        const matched = findBestVoice(cfg.speechLang, cfg.speechPrefix);
        if (!matched) {
          notice.innerHTML = `<strong>Voice Tip:</strong> No local <code>${escapeHtml(cfg.speechLang)}</code> voice was detected on this device—if pronunciation sounds off, tap <strong>Google Translate &nearr;</strong> above for native audio.`;
          notice.classList.remove('hidden');
        } else {
          notice.classList.add('hidden');
        }
      }
    }

    /* =========================================================================
       5. SESSION TIMER & WEB AUDIO CHIME
       ========================================================================= */
    function formatTime(totalSec) {
      const mins = Math.floor(totalSec / 60);
      const secs = totalSec % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function playGentleChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        // Soft two-note bell chime (C5 -> G5)
        [523.25, 783.99].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.18);
          gain.gain.setValueAtTime(0.0001, now + i * 0.18);
          gain.gain.linearRampToValueAtTime(0.08, now + i * 0.18 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.18 + 0.85);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + i * 0.18);
          osc.stop(now + i * 0.18 + 0.9);
        });
      } catch (err) {
        // AudioContext blocked or unsupported; silently skip chime
      }
    }

    function pauseAllTimers() {
      Object.keys(state.timers).forEach((key) => {
        const t = state.timers[key];
        if (t.intervalId) {
          clearInterval(t.intervalId);
          t.intervalId = null;
        }
        t.running = false;
      });
    }

    function resetAllTimers() {
      pauseAllTimers();
      LANG_CONFIG.forEach((cfg) => {
        state.timers[cfg.key].remaining = cfg.durationSec;
      });
    }

    function toggleTimer(langKey) {
      const timer = state.timers[langKey];
      const cfg = LANG_CONFIG.find((c) => c.key === langKey);
      if (!timer || !cfg) return;

      if (timer.running) {
        clearInterval(timer.intervalId);
        timer.intervalId = null;
        timer.running = false;
      } else {
        if (timer.remaining <= 0) {
          timer.remaining = cfg.durationSec;
        }
        timer.running = true;
        timer.intervalId = setInterval(() => {
          timer.remaining -= 1;
          updateTimerUI(langKey);

          if (timer.remaining <= 0) {
            clearInterval(timer.intervalId);
            timer.intervalId = null;
            timer.running = false;
            playGentleChime();
            showToast(`${cfg.fullTitle} session timer complete!`, 'success');
            updateTimerUI(langKey);
          }
        }, 1000);
      }
      updateTimerUI(langKey);
    }

    function resetTimer(langKey) {
      const timer = state.timers[langKey];
      const cfg = LANG_CONFIG.find((c) => c.key === langKey);
      if (!timer || !cfg) return;

      if (timer.intervalId) {
        clearInterval(timer.intervalId);
        timer.intervalId = null;
      }
      timer.running = false;
      timer.remaining = cfg.durationSec;
      updateTimerUI(langKey);
    }

    function updateTimerUI(langKey) {
      if (state.activeLangKey !== langKey) return;
      const timer = state.timers[langKey];
      const cfg = LANG_CONFIG.find((c) => c.key === langKey);
      const display = document.getElementById('timer-display');
      const toggleBtn = document.getElementById('timer-toggle-btn');
      const bar = document.getElementById('timer-progress-bar');

      if (display) {
        display.textContent = formatTime(timer.remaining);
        display.className = `font-mono text-base sm:text-lg font-bold tabular-nums ${
          timer.remaining === 0 ? 'text-teal-700' : 'text-slate-900'
        }`;
      }
      if (toggleBtn) {
        toggleBtn.textContent = timer.running
          ? 'Pause'
          : timer.remaining === 0
          ? 'Restart'
          : 'Start';
      }
      if (bar && cfg) {
        const pct = Math.max(0, Math.min(100, ((cfg.durationSec - timer.remaining) / cfg.durationSec) * 100));
        bar.style.width = `${pct}%`;
      }
    }

    /* =========================================================================
       6. UTILITIES & INLINE SVG ICONS
       ========================================================================= */
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getActiveVerse() {
      return VERSES[state.verseIndex] || VERSES[0];
    }

    function getActiveLangConfig() {
      return LANG_CONFIG.find((c) => c.key === state.activeLangKey) || LANG_CONFIG[0];
    }

    function getSpeakerIconSVG() {
      return `<svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>`;
    }

    function getStopIconSVG() {
      return `<svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <rect x="6" y="6" width="12" height="12" rx="2"></rect>
      </svg>`;
    }

    function getCheckIconSVG() {
      return `<svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>`;
    }

    function getPlayCircleIconSVG() {
      return `<svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"></path>
      </svg>`;
    }

    function getClockIconSVG() {
      return `<svg class="w-4 h-4 text-[#3b4b80] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>`;
    }

    function showToast(message, variant = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const palette =
        variant === 'success'
          ? 'bg-teal-700 text-white'
          : variant === 'warn'
          ? 'bg-amber-700 text-white'
          : 'bg-slate-800 text-white';

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto rounded-xl px-4 py-3 text-xs sm:text-sm font-medium shadow-lg transition-all duration-300 opacity-0 translate-y-2 ${palette}`;
      toast.textContent = message;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('opacity-0', 'translate-y-2');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    /**
     * Pairs Chinese characters with their exact corresponding pinyin syllables.
     * Supports space-separated pairs like ("起 初", "qǐ chū") AND gracefully handles
     * unspaced characters if pasted later (e.g., "起初", "qǐ chū").
     */
    function buildChinesePairs(charsStr, pinyinStr) {
      const charTokens = String(charsStr).trim().split(/\s+/).filter(Boolean);
      const pinyinTokens = String(pinyinStr).trim().split(/\s+/).filter(Boolean);

      if (charTokens.length === pinyinTokens.length) {
        return charTokens.map((c, idx) => ({ c, p: pinyinTokens[idx] }));
      }

      const individualGlyphs = Array.from(String(charsStr).replace(/\s+/g, ''));
      if (individualGlyphs.length === pinyinTokens.length) {
        return individualGlyphs.map((c, idx) => ({ c, p: pinyinTokens[idx] }));
      }

      return [{ c: String(charsStr).replace(/\s+/g, ''), p: String(pinyinStr).trim() }];
    }

    function renderVerseSelector() {
      const select = document.getElementById('verse-select');
      const prevBtn = document.getElementById('prev-verse-btn');
      const nextBtn = document.getElementById('next-verse-btn');
      const badge = document.getElementById('progress-badge');
      const activeVerse = getActiveVerse();

      if (select) {
        select.innerHTML = VERSES.map((v, idx) => {
          const doneCount = countVerseDone(v.id);
          const suffix = doneCount === LANG_CONFIG.length ? ' ✓' : doneCount > 0 ? ` (${doneCount}/5)` : '';
          return `<option value="${idx}" ${idx === state.verseIndex ? 'selected' : ''}>${escapeHtml(v.title)}${suffix}</option>`;
        }).join('');
      }

      if (prevBtn) prevBtn.disabled = state.verseIndex <= 0;
      if (nextBtn) nextBtn.disabled = state.verseIndex >= VERSES.length - 1;

      if (badge && activeVerse) {
        const doneCount = countVerseDone(activeVerse.id);
        badge.textContent = `${doneCount} / ${LANG_CONFIG.length} done`;
        badge.className =
          doneCount === LANG_CONFIG.length
            ? 'text-xs font-bold px-2.5 py-0.5 rounded-full bg-teal-100 text-teal-800'
            : 'text-xs font-bold px-2.5 py-0.5 rounded-full bg-scholar-light text-[#3b4b80]';
      }
    }

    function renderTabs() {
      const tabBar = document.getElementById('tab-bar');
      const verse = getActiveVerse();

      tabBar.innerHTML = LANG_CONFIG.map((cfg) => {
        const isActive = cfg.key === state.activeLangKey;
        const done = isLangDone(verse.id, cfg.key);

        const tabClasses = isActive
          ? 'bg-[#3b4b80] text-white border-[#3b4b80] shadow-sm'
          : 'bg-white text-slate-600 border-stone-200 hover:border-[#3b4b80]/50 hover:text-[#3b4b80]';

        const checkBadge = done
          ? `<span class="inline-flex items-center justify-center w-4 h-4 rounded-full ${

            }" title="Completed">${getCheckIconSVG()}</span>`

        return `

            type="button"

            data-lang-key="${cfg.key}"

    function attachPanelListeners(cfg, verse, data) {
      // Timer buttons
      const toggleBtn = document.getElementById('timer-toggle-btn');
      const resetBtn = document.getElementById('timer-reset-btn');
      if (toggleBtn) toggleBtn.addEventListener('click', () => toggleTimer(cfg.key));
      if (resetBtn) resetBtn.addEventListener('click', () => resetTimer(cfg.key));

      // Mark Done toggle
      const markDoneBtn = document.getElementById('mark-done-btn');
      if (markDoneBtn) {
        markDoneBtn.addEventListener('click', () => {
          const currentlyDone = isLangDone(verse.id, cfg.key);
          setLangDone(verse.id, cfg.key, !currentlyDone);
          if (!currentlyDone) {
            showToast(`${verse.title} — ${cfg.tabLabel} marked done!`, 'success');
          }
          renderApp();
        });
      }

      // Audio Controls
      if (cfg.hasAudio) {
        const fullVerseBtn = document.getElementById('full-verse-play-btn');
        if (fullVerseBtn) {
          fullVerseBtn.addEventListener('click', () => {
            speakText(data.verse, cfg, `${verse.id}-${cfg.key}-verse`);
          });
        }

        // Speed toggle
        document.querySelectorAll('.speed-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            const nextRate = parseFloat(btn.getAttribute('data-speed'));
            if (!Number.isNaN(nextRate)) {
              state.speechRate = nextRate;
              stopSpeaking();
              renderApp();
              showToast(`Audio speed: ${nextRate === 0.7 ? '0.7x Slow' : '1.0x Normal'}`);
            }
          });
        });

        // Individual word buttons (lookup text safely from data.words by index)
        document.querySelectorAll('[data-row-index]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const idx = parseInt(btn.getAttribute('data-row-index'), 10);
            const row = data.words[idx];
            if (!row) return;
            const speakKey = btn.getAttribute('data-speak-key');
            speakText(row[0], cfg, speakKey);
          });
        });

        updateSpeakingButtonsUI();
        updateVoiceNotice();
      }
    }

    function renderApp() {
      const verse = getActiveVerse();
      const cfg = getActiveLangConfig();
      if (!verse || !cfg) return;

      const data = verse[cfg.key];
      renderVerseSelector();
      renderTabs();

      const panel = document.getElementById('study-panel');
      if (!panel) return;

      if (!data) {
        panel.innerHTML = `
          <div class="bg-white border border-stone-200 rounded-2xl p-8 text-center text-slate-500">
            No ${escapeHtml(cfg.fullTitle)} entry found for ${escapeHtml(verse.title)}.
          </div>
        `;
        return;
      }

      panel.innerHTML = `
        ${renderTimerBar(cfg, verse)}
        ${renderVerseCard(cfg, verse, data)}
        ${renderWordTable(cfg, verse, data)}
        ${renderNotesAndDrill(data)}
      `;

      attachPanelListeners(cfg, verse, data);
    }

    function switchVerse(newIndex) {
      if (newIndex < 0 || newIndex >= VERSES.length || newIndex === state.verseIndex) return;
      stopSpeaking();
      resetAllTimers();
      state.verseIndex = newIndex;
      saveLastSelection();
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* =========================================================================
       9. APP INITIALIZATION
       ========================================================================= */
    function initApp() {
      restoreLastSelection();

      const select = document.getElementById('verse-select');
      const prevBtn = document.getElementById('prev-verse-btn');
      const nextBtn = document.getElementById('next-verse-btn');

      if (select) {
        select.addEventListener('change', (e) => {
          const idx = parseInt(e.target.value, 10);
          if (!Number.isNaN(idx)) switchVerse(idx);
        });
      }

      if (prevBtn) {
        prevBtn.addEventListener('click', () => switchVerse(state.verseIndex - 1));
      }

      if (nextBtn) {
        nextBtn.addEventListener('click', () => switchVerse(state.verseIndex + 1));
      }

      renderApp();
    }

    window.addEventListener('DOMContentLoaded', initApp);
    window.addEventListener('beforeunload', stopSpeaking);
